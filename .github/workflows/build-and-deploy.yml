name: Build and deploy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./
          push: true
          secrets: |
            "ONTAP_API_KEY=${{ secrets.ONTAP_API_KEY }}"
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:ontap-bot-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
    env:
      NOMAD_ADDR: http://127.0.0.1:4646
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Set up nomad cli
        run: |
          curl --fail --show-error --silent --location --retry 3 https://releases.hashicorp.com/nomad/2.0.4/nomad_2.0.4_linux_amd64.zip -o nomad.zip
          unzip nomad.zip
          chmod +x nomad

      - name: Setup cloudflared
        run: |
          curl --fail --show-error --silent --location --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Spawn cloudflared tunnel
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_SERVICE_TOKEN_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_SERVICE_TOKEN_SECRET }}
          NOMAD_CF_HOSTNAME: ${{ vars.NOMAD_CF_HOSTNAME || 'nomad-tcp.justdockerize.it' }}
        run: |
          nohup ./cloudflared access tcp --hostname "$NOMAD_CF_HOSTNAME" --url 127.0.0.1:4646 > cloudflared.nohup.log 2>&1 &
          echo $! > cloudflared.pid

      - name: Wait for Nomad tunnel
        run: |
          for attempt in {1..30}; do
            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              echo "Cloudflared exited before the tunnel became ready"
              exit 1
            fi
            echo "Waiting for Nomad tunnel (attempt ${attempt}/30)"
            if curl --silent --show-error --fail --connect-timeout 2 --max-time 5 "${NOMAD_ADDR}/v1/status/leader" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Nomad tunnel did not become ready"
          exit 1

      - name: Deploy to nomad
        timeout-minutes: 5
        env:
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          NOMAD_VAR_docker_user: ${{ secrets.DOCKERHUB_USERNAME }}
          NOMAD_VAR_docker_password: ${{ secrets.DOCKERHUB_TOKEN }}
          NOMAD_VAR_dockerhub_repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          NOMAD_VAR_image_tag: ontap-bot-${{ github.sha }}
          NOMAD_VAR_ontap_api_key: ${{ secrets.ONTAP_API_KEY }}
          NOMAD_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOMAD_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          NOMAD_VAR_hyperdx_api_key: ${{ secrets.HYPERDX_API_KEY }}
        run: ./nomad job run ./ci/ontap-bot.nomad

      - name: Stop cloudflared tunnel
        if: always()
        run: |
          if [ -f cloudflared.pid ]; then
            kill "$(cat cloudflared.pid)" || true
          fi

      - name: Print cloudflared log on failure
        if: failure()
        run: |
          if [ -f cloudflared.nohup.log ]; then
            cat cloudflared.nohup.log
          fi
